[package]
name = "tree-sitter-latex"
description = "A Tree-sitter grammar for LaTeX documents."
version = "1.0.0"
keywords = ["incremental", "parsing", "latex"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/lumine-code/tree-sitter-latex"
edition = "2018"
license = "MIT"
authors = ["lumine-code"]
readme = "README.md"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*", "LICENSE", "THIRD_PARTY_NOTICES"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "0.24.1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "bench_main"
path = "benches/bench_main.rs"
harness = false
