name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm rebuild tree-sitter-cli
      - run: npm run generate
      - run: npm test
      # This large parser can exhaust Node 24's optimizing Wasm compiler zone
      # on Windows. The WASM suite uses Liftoff to bound compiler memory; real
      # editor integration still runs with Electron's normal runtime settings.
      - run: npm run test:wasm
      - run: npm pack --dry-run
