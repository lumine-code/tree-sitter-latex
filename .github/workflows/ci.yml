name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm rebuild tree-sitter-cli
      - run: npm run generate
      - run: npm test
      # This large parser can exhaust Node 24's optimizing Wasm compiler zone
      # on Windows. The WASM suite uses Liftoff to bound compiler memory; real
      # editor integration still runs with Electron's normal runtime settings.
      - run: npm run test:wasm
      - run: npm pack --dry-run
      - name: Use stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Test Rust bindings and benchmarks
        run: cargo +stable test --all-targets
      - name: Test Rust documentation
        run: cargo +stable test --doc --locked
      - name: Verify Rust crate packaging
        run: cargo +stable package --allow-dirty --locked
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build and test Python source distribution
        shell: bash
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          import zipfile

          sdists = list(Path("dist").glob("*.tar.gz"))
          wheels = list(Path("dist").glob("*.whl"))
          assert len(sdists) == len(wheels) == 1, (sdists, wheels)
          with tarfile.open(sdists[0]) as source, zipfile.ZipFile(wheels[0]) as wheel:
              for filename in ("LICENSE", "THIRD_PARTY_NOTICES"):
                  expected = Path(filename).read_bytes()
                  source_files = [entry for entry in source.getmembers()
                                  if entry.isfile() and entry.name.split("/", 1)[-1] == filename]
                  wheel_files = [entry for entry in wheel.namelist()
                                 if entry.endswith(f".dist-info/licenses/{filename}")]
                  assert len(source_files) == len(wheel_files) == 1, filename
                  assert source.extractfile(source_files[0]).read() == expected, filename
                  assert wheel.read(wheel_files[0]) == expected, filename
          subprocess.check_call([sys.executable, "-m", "pip", "install", f"{wheels[0].resolve()}[core]"])
          PY
          python -m unittest discover -s bindings/python/tests -v
          python -m pip check
